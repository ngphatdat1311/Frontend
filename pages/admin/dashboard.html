<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <title>Blossom – Tiến độ bài viết</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS dùng chung -->
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <!-- CSS riêng của trang -->
    <link rel="stylesheet" href="../../css/admin/dashboard.css">
    <link rel="stylesheet" href="../../css/notifications.css">

    <!-- Kiểm tra đăng nhập + phân quyền (chạy trước khi hiển thị trang) -->
    <script src="../../js/auth.js"></script>
    <script src="../../js/permissions.js"></script>
</head>

<body data-search="Tìm kiếm bài viết..." data-active="dashboard.html">

    <!-- Sidebar + Header + Footer do js/layout.js render -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">

        <header class="topbar" id="topbar"></header>

        <main class="content">

            <div class="crumb">Blossom / Tổng quan / Tiến độ bài viết</div>

            <h2 class="page-title">Tiến độ bài viết</h2>

            <p class="page-sub">
                Từng bước hoàn thiện nội dung, cùng đội ngũ giữ nhịp sáng tạo.
            </p>

            <section class="stats" id="stats"></section>

            <div class="bar">

                <div class="tabs">
                    <button type="button" class="tab active" id="tabProgress">Bảng tiến độ</button>
                    <button type="button" class="tab" id="tabMembers">Theo thành viên</button>
                </div>

                <div class="filters">
                    <select class="select" id="filterAuthor" aria-label="Lọc theo tác giả">
                        <option value="ALL">Tất cả tác giả</option>
                    </select>

                    <select class="select" id="filterCampaign" aria-label="Lọc theo chiến dịch">
                        <option value="ALL">Tất cả chiến dịch</option>
                        <option value="Chăm sóc da thu đông">Chăm sóc da thu đông</option>
                        <option value="Tuần lễ hoa anh đào">Tuần lễ hoa anh đào</option>
                        <option value="Bộ sưu tập son thuần chay">Bộ sưu tập son thuần chay</option>
                    </select>
                </div>
            </div>

            <section class="board" id="board"></section>

            <div class="priority" id="priorityBox">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2c.6 5 2.5 7.4 8 8-5.5.6-7.4 3-8 12-.6-9-2.5-11.4-8-12 5.5-.6 7.4-3 8-8z"/>
                </svg>

                <div>
                    <b id="priorityTitle">Ưu tiên hôm nay</b>
                    <p id="priorityDesc">Đang tải dữ liệu tiến độ công việc...</p>
                </div>

                <a href="approvals.html" class="link" id="priorityLink">Xem công việc</a>
            </div>

        </main>

        <footer class="footer" id="footer"></footer>
    </div>

    <!-- JavaScript: component → layout → logic của trang -->
    <script src="../../js/components.js"></script>
    <script src="../../js/layout.js"></script>
    <script src="../../js/notifications-store.js"></script>
    <script src="../../js/admin/dashboard.js"></script>

</body>
</html>
